{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Member - ASHA Care</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

<div class="app-layout">


    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="small-logo">
                A
            </div>

            <div>

                <h2>
                    ASHA Care
                </h2>

                <span>
                    Healthcare Portal
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <a
                href="{% url 'dashboard' %}"
                class="nav-item"
            >
                <span>▣</span>
                Dashboard
            </a>


            <a
                href="{% url 'add_family' %}"
                class="nav-item"
            >
                <span>+</span>
                Add Family
            </a>


            <a
                href="{% url 'family_list' %}"
                class="nav-item"
            >
                <span>⌂</span>
                Family List
            </a>


            <a
                href="{% url 'add_member' %}"
                class="nav-item active"
            >
                <span>+</span>
                Add Member
            </a>


            <a
                href="{% url 'member_list' %}"
                class="nav-item"
            >
                <span>♙</span>
                Member List
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="{% url 'logout' %}"
                class="nav-item logout"
            >
                <span>↪</span>
                Logout
            </a>

        </div>

    </aside>



    <main class="main-content">


        <header class="topbar">

            <div>

                <h1>
                    Add Member
                </h1>

                <p>
                    Add a member to an existing family.
                </p>

            </div>

        </header>



        <section class="form-section">


            <div class="form-card">


                <div class="form-card-header">

                    <div>

                        <h2>
                            Member Details
                        </h2>

                        <p>
                            Enter the member's information below.
                        </p>

                    </div>

                </div>



                <form method="POST">

                    {% csrf_token %}


                    <div class="form-group">

                        <label>
                            Select Family
                            <span>*</span>
                        </label>


                        <select
                            name="family"
                            required
                        >

                            <option value="">
                                Select a family
                            </option>


                            {% for family in families %}

                                <option value="{{ family.id }}">

                                    {{ family.family_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>



                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                Full Name
                                <span>*</span>
                            </label>

                            <input
                                type="text"
                                name="name"
                                placeholder="Enter full name"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label>
                                Age
                                <span>*</span>
                            </label>

                            <input
                                type="number"
                                name="age"
                                placeholder="Enter age"
                                min="0"
                                max="150"
                                required
                            >

                        </div>


                    </div>



                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                Gender
                                <span>*</span>
                            </label>


                            <select
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label>
                                Relation
                                <span>*</span>
                            </label>


                            <select
                                name="relation"
                                required
                            >

                                <option value="">
                                    Select relation
                                </option>

                                <option value="Father">
                                    Father
                                </option>

                                <option value="Mother">
                                    Mother
                                </option>

                                <option value="Son">
                                    Son
                                </option>

                                <option value="Daughter">
                                    Daughter
                                </option>

                                <option value="Brother">
                                    Brother
                                </option>

                                <option value="Sister">
                                    Sister
                                </option>

                                <option value="Husband">
                                    Husband
                                </option>

                                <option value="Wife">
                                    Wife
                                </option>

                                <option value="Grandfather">
                                    Grandfather
                                </option>

                                <option value="Grandmother">
                                    Grandmother
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                    </div>



                    <div class="form-actions">

                        <a
                            href="{% url 'dashboard' %}"
                            class="secondary-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="primary-btn"
                        >
                            Save Member
                        </button>

                    </div>


                </form>

            </div>

        </section>

    </main>

</div>

</body>
</html>
